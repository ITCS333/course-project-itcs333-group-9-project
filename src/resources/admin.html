<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Resources</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>

<header>
    <h1>Manage Course Resources</h1>
    <hr>
</header>

<main>

<section id="add-edit-section">
    <h2>Add a New Resource</h2>

    <form id="resource-form" action="#">
        <fieldset>
            <legend>Resource Details</legend>

            <label for="resource-title">Resource Title:</label><br>
            <input type="text" id="resource-title" name="title" placeholder="e.g. Chapter 1 Notes" required><br><br>

            <label for="resource-description">Description:</label><br>
            <textarea id="resource-description" name="description" rows="4" cols="50" placeholder="Enter a brief description..."></textarea><br><br>

            <label for="resource-link">Resource Link:</label><br>
            <input type="url" id="resource-link" name="link" placeholder="e.g. https://example.com/notes.pdf" required><br><br>

            <button id="add-resource" type="submit">Add Resource</button>
        </fieldset>
    </form>
</section>

<section id="list-section">
    <h2>Existing Resources</h2>

    <table id="resources-table" border="1" cellpadding="8" cellspacing="0">
        <thead>
            <tr>
                <th>Title</th>
                <th>Description</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody id="resources-tbody">

            <!--
            **********************************************
            DUMMY EXAMPLE ROWS (COMMENTED OUT) so i can use resources.json
            **********************************************

            <tr>
                <td>Chapter 1 Notes</td>
                <td>Introduction to HTML and CSS basics.</td>
                <td>
                    <button class="edit-btn">Edit</button>
                    <button class="delete-btn">Delete</button>
                </td>
            </tr>

            <tr>
                <td>Web Development Guide</td>
                <td>External link to MDN documentation.</td>
                <td>
                    <button class="edit-btn">Edit</button>
                    <button class="delete-btn">Delete</button>
                </td>
            </tr>
            ************************************************
            -->
            
        </tbody>
    </table>
</section>

</main>

<script src="admin.js" defer></script>

</body>
</html>
